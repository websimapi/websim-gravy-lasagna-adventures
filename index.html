<html><head><base href="<html>
<head>
    <meta charset="UTF-8">
    <title>Gravy Lasagna Adventures</title>
    <style>
        body {
            background: #2b1810;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Comic Sans MS', cursive;
        }

        .lasagna-container {
            position: relative;
            width: 300px;
            height: 300px;
            cursor: pointer;
            filter: drop-shadow(0 0 10px #613613);
        }

        .gravy-wave {
            position: absolute;
            width: 100%;
            height: 40px;
            background: #613613;
            animation: waveAnimation 2s infinite ease-in-out;
            border-radius: 5px;
            opacity: 0.8;
        }

        @keyframes waveAnimation {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(10px) rotate(1deg); }
        }

        .lasagna-layer {
            position: absolute;
            width: 100%;
            height: 40px;
            background: #ffa07a;
            border: 2px solid #8b4513;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .splash {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            font-size: 24px;
            z-index: 100;
        }

        @keyframes splashAnimation {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }

        .title {
            position: absolute;
            top: 20px;
            color: #ffd700;
            font-size: 2.5em;
            text-align: center;
            width: 100%;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: titleGlow 2s infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 2px 2px 4px rgba(97, 54, 19, 0.5); }
            50% { text-shadow: 2px 2px 15px rgba(255, 215, 0, 0.8); }
        }

        .gravy-particles {
            position: absolute;
            pointer-events: none;
            color: #613613;
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="title">🍝 Lagravy 🥘</div>
    <div class="lasagna-container" id="lasagnaContainer">
        <!-- Layers will be generated by JS -->
    </div>

    <script>
        const container = document.getElementById('lasagnaContainer');
        
        // Create lasagna layers
        for (let i = 0; i < 6; i++) {
            const layer = document.createElement('div');
            layer.className = 'lasagna-layer';
            layer.style.bottom = `${i * 50}px`;
            container.appendChild(layer);

            const gravyWave = document.createElement('div');
            gravyWave.className = 'gravy-wave';
            gravyWave.style.bottom = `${(i * 50) + 40}px`;
            gravyWave.style.animationDelay = `${i * 0.2}s`;
            container.appendChild(gravyWave);
        }

        // Add gravy particles
        function createGravyParticle() {
            const particle = document.createElement('div');
            particle.className = 'gravy-particles';
            particle.innerHTML = '💧';
            particle.style.left = `${Math.random() * window.innerWidth}px`;
            particle.style.top = `${Math.random() * window.innerHeight}px`;
            particle.style.animationDelay = `${Math.random() * 2}s`;
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 3000);
        }

        setInterval(createGravyParticle, 500);

        // Add gravy splash effect
        container.addEventListener('click', (e) => {
            const splashEmojis = ['💧', '🌊', '💦'];
            const splash = document.createElement('div');
            splash.className = 'splash';
            splash.innerHTML = splashEmojis[Math.floor(Math.random() * splashEmojis.length)];
            splash.style.position = 'absolute';
            splash.style.left = `${e.offsetX}px`;
            splash.style.top = `${e.offsetY}px`;

            // Random splash direction
            const angle = Math.random() * Math.PI * 2;
            const distance = 50 + Math.random() * 50;
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance;

            splash.style.setProperty('--x', `${x}px`);
            splash.style.setProperty('--y', `${y}px`);
            splash.style.animation = 'splashAnimation 1s forwards';

            container.appendChild(splash);
            setTimeout(() => splash.remove(), 1000);

            // Wobble effect on layers
            const layers = document.querySelectorAll('.lasagna-layer');
            layers.forEach((layer, index) => {
                layer.style.transform = `translateX(-5px) rotate(-${index}deg)`;
                setTimeout(() => {
                    layer.style.transform = `translateX(5px) rotate(${index}deg)`;
                    setTimeout(() => {
                        layer.style.transform = 'translateX(0) rotate(0deg)';
                    }, 100);
                }, 100);
            });
        });
    </script>
